# This file must live in config/: ZMK only picks up a `<shield-dir>.conf` from the
# user config directory. In the shield folder Zephyr would only load the exact
# `dactyl-manuform-5x6_left.conf` / `_right.conf` names.

# Save battery by entering deep sleep after inactivity
# (CONFIG_ZMK_IDLE_SLEEP_TIMEOUT, 15 min by default). Needs `wakeup-source` on
# kscan0 in the shield dtsi, otherwise a key press cannot wake the board.
CONFIG_ZMK_SLEEP=y

# Battery state-of-charge reporting. Required for the green battery-level
# indicator LED (CONFIG_DACTYL_BATT_LED) to know the charge level.
CONFIG_ZMK_BATTERY_REPORTING=y

# Take the percentage straight from the sensor (src/battery_ncr18650.c, which
# applies the NCR18650B discharge curve). The alternative fetch mode makes ZMK
# re-derive a percentage from the voltage with its own linear approximation,
# which is exactly what this module replaces.
CONFIG_ZMK_BATTERY_REPORTING_FETCH_MODE_STATE_OF_CHARGE=y

# Uncomment to extend BLE range / power (may reduce battery life)
# CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
